{% extends "base.html" %}
{% block title %}User Details{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-14">

    <!-- HEADER -->
    <div class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-darktext">
            User Details
        </h1>
        <p class="text-darktext/60 mt-2">
            Complete personal information for
            <span class="font-semibold">{{ target_user.username }}</span>
        </p>
    </div>

    <!-- FORM -->
    <form method="post"
          class="bg-white border border-lilac/50 rounded-3xl p-12 space-y-6">
        {% csrf_token %}

        <!-- FIRST NAME -->
        <div>
            <label class="block text-sm font-semibold text-darktext mb-2">
                First Name
            </label>
            <input type="text"
                   name="first_name"
                   value="{{ target_user.first_name }}"
                   class="w-full rounded-xl border border-lilac/50 px-5 py-3
                          focus:ring-2 focus:ring-lilac focus:outline-none">
        </div>

        <!-- LAST NAME -->
        <div>
            <label class="block text-sm font-semibold text-darktext mb-2">
                Last Name
            </label>
            <input type="text"
                   name="last_name"
                   value="{{ target_user.last_name }}"
                   class="w-full rounded-xl border border-lilac/50 px-5 py-3
                          focus:ring-2 focus:ring-lilac focus:outline-none">
        </div>

        <!-- EMAIL -->
        <div>
            <label class="block text-sm font-semibold text-darktext mb-2">
                Email
            </label>
            <input type="email"
                   name="email"
                   value="{{ target_user.email }}"
                   class="w-full rounded-xl border border-lilac/50 px-5 py-3
                          focus:ring-2 focus:ring-lilac focus:outline-none">
        </div>

        <!-- ACTIONS -->
        <div class="flex justify-end gap-4 pt-8">
            <a href="{% url 'ceo_users' %}"
               class="px-7 py-2.5 rounded-full
                      border border-lilac/50
                      text-darktext font-semibold
                      hover:bg-lilac/20 transition">
                Back
            </a>

            <button type="submit"
                    class="px-9 py-2.5 rounded-full
                           bg-lilac text-darktext
                           font-bold hover:opacity-90 transition">
                Save Details
            </button>
        </div>

    </form>
</div>
{% endblock %}
