{% extends "base.html" %}
{% block title %}Create User{% endblock %}

{% block content %}

<style>
.local-dropdown {
  position: relative;
}

.local-trigger {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #c7b7ff;
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
}

.local-menu {
  display: none;
  position: absolute;
  top: 110%;
  left: 0;
  width: 100%;
  background: white;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
  z-index: 50;
  overflow: hidden;
}

.local-dropdown.open .local-menu {
  display: block;
}

.local-item {
  padding: 10px 16px;
  cursor: pointer;
}

.local-item:hover {
  background: #efeaff;
}
</style>

<div class="max-w-xl mx-auto px-6 py-12">

    <h1 class="text-3xl font-extrabold text-darktext mb-2">
        Create User
    </h1>
    <p class="text-darktext/60 mb-6">
        {{ department.name }} Department
    </p>

    <form method="post"
          class="bg-white border border-lilac/50 rounded-2xl p-8 space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-semibold mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full rounded-lg border border-lilac/50 px-4 py-2">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full rounded-lg border border-lilac/50 px-4 py-2">
        </div>
        <!-- ROLE -->
        <div>
        <label class="block text-sm font-semibold mb-1 text-darktext">
            Role
        </label>

        <div id="roleDropdown" class="local-dropdown">
            <div class="local-trigger">
            <span id="roleText">Select role</span>
            ▼
            </div>

            <!-- THIS is what Django reads -->
            <input type="hidden" name="role" id="roleInput" required>

            <div class="local-menu">
            <div class="local-item" data-value="STUDENT">Student</div>
            <div class="local-item" data-value="TEACHER">Teacher</div>
            </div>
        </div>
        </div>


        <div class="flex justify-end gap-4 pt-4">
            <a href="{% url 'hod_manage_users' %}"
               class="px-5 py-2 rounded-full border border-lilac/50">
                Cancel
            </a>

            <button type="submit"
                    class="px-6 py-2 rounded-full bg-lilac font-semibold">
                Create User
            </button>
        </div>
    </form>

</div>

<script>
function setupLocalDropdown(id, textId, inputId) {
  const box = document.getElementById(id);
  if (!box) return; // safety

  const trigger = box.querySelector(".local-trigger");
  const text = document.getElementById(textId);
  const input = document.getElementById(inputId);

  trigger.addEventListener("click", () => {
    box.classList.toggle("open");
  });

  box.querySelectorAll(".local-item").forEach(item => {
    item.addEventListener("click", () => {
      text.innerText = item.innerText;
      input.value = item.dataset.value;
      box.classList.remove("open");
    });
  });

  document.addEventListener("click", e => {
    if (!box.contains(e.target)) box.classList.remove("open");
  });
}

/* INIT ONLY WHAT EXISTS */
setupLocalDropdown("roleDropdown", "roleText", "roleInput");
</script>


{% endblock %}
